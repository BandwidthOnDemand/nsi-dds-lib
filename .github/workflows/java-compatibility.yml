name: Java compatibility

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  source-build:
    name: Build and Javadoc / Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21, 25, 27]
    env:
      PACKAGE_USER: ${{ secrets.PACKAGES_USERNAME || github.actor }}
      PACKAGE_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          server-id: github
          server-username: PACKAGE_USER
          server-password: PACKAGE_TOKEN
      - name: Install Maven 3.10.0
        run: bash .github/scripts/setup-maven.sh
      - name: Verify clean-cache dependency access
        shell: bash
        run: |
          if ! mvn --batch-mode --no-transfer-progress dependency:resolve; then
            echo '::error::Dependency resolution failed. Verify common-lib:2.0.1 publication and GitHub Packages read access. Cross-repository packages may require PACKAGES_USERNAME/PACKAGES_READ_TOKEN; forks require a reviewed maintainer-branch run.'
            exit 1
          fi
      - name: Check compatibility helper regressions
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Resolve verification classpath
        run: mvn --batch-mode --no-transfer-progress dependency:build-classpath -Dmdep.outputFile=target/compatibility-classpath.txt
      - name: Verify Java 17 baseline and current runtime bytecode
        run: |
          python3 -B .github/scripts/compatibility.py bytecode --java 17
          python3 -B .github/scripts/compatibility.py bytecode --java ${{ matrix.java }}
      - name: Validate handwritten production and test Javadoc
        run: python3 -B .github/scripts/compatibility.py javadoc
      - name: Bundle the Java 17 artifact and compiled tests
        if: matrix.java == 17
        run: python3 -B .github/scripts/compatibility.py bundle target/java17-runtime.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.java == 17
        with:
          name: java17-runtime
          path: target/java17-runtime.zip
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: source-build-reports-${{ matrix.java }}
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  shared-artifact-runtime:
    name: Java 17 artifact / runtime ${{ matrix.java }}
    needs: source-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21, 25, 27]
    env:
      PACKAGE_USER: ${{ secrets.PACKAGES_USERNAME || github.actor }}
      PACKAGE_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          server-id: github
          server-username: PACKAGE_USER
          server-password: PACKAGE_TOKEN
      - name: Install Maven 3.10.0
        run: bash .github/scripts/setup-maven.sh
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: java17-runtime
          path: runtime-bundle
      - name: Restore packaged classes and compiled tests
        run: python3 -B .github/scripts/compatibility.py restore runtime-bundle/java17-runtime.zip
      - name: Resolve verification classpath
        shell: bash
        run: |
          if ! mvn --batch-mode --no-transfer-progress dependency:build-classpath -Dmdep.outputFile=target/compatibility-classpath.txt; then
            echo '::error::Dependency resolution failed. Verify common-lib:2.0.1 publication and GitHub Packages read access; no runtime tests have been skipped or certified.'
            exit 1
          fi
      - name: Verify current runtime bytecode
        run: python3 -B .github/scripts/compatibility.py bytecode --java ${{ matrix.java }}
      - name: Run the Java 17-compiled tests without recompiling
        run: mvn --batch-mode --no-transfer-progress surefire:test -DfailIfNoTests=true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: runtime-reports-${{ matrix.java }}
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7
